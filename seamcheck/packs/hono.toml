# Hono: true for any Hono app. Its type knowledge (below) applies whenever
# package.json names hono; its rules (none yet) with `[project] packs = ["hono"]`.

# Hono hands each handler and middleware its Context: `(c, next)` in a
# middleware, `(c) =>` in a route (`app.get('/', (c) => c.json(...))`). Its
# methods are hono's own (src/context.ts of the hono package): in an app,
# library calls; in hono itself, project code.
[[param]]
id = "middleware"
names = ["c", "next"]
types = { c = "hono:src/context" }

[[param]]
id = "route"
names = ["c"]
in_call = ["get", "post", "put", "delete", "patch", "options", "all", "on", "use", "route", "notFound", "onError"]
types = { c = "hono:src/context" }

[[param]]
id = "route-ctx"
names = ["ctx"]
in_call = ["get", "post", "put", "delete", "patch", "options", "all", "on", "use", "route", "notFound", "onError"]
types = { ctx = "hono:src/context" }

# The RPC client (`hc<typeof app>(url)`, `testClient(app)`) is a runtime Proxy:
# every `client.posts.$get()` is a fetch, and the response it gives is the
# platform's Response, never a project function, in an app or in hono itself.
[[returns]]
id = "rpc-client"
functions = ["hc", "testClient"]
