name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  pyz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover tests
      - run: python tools/build_pyz.py dist/seamcheck.pyz && python dist/seamcheck.pyz --version
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/seamcheck.pyz
